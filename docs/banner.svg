<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="t">
  <title id="t">VINNA-01: robot de escritorio con inteligencia artificial. Cerebro local o en la nube, memoria que tú autorizas y un rostro de gato animado.</title>
  <defs>
    <pattern id="p" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#A99BC4" opacity="0.14"/></pattern>
    <filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <clipPath id="m"><rect width="1200" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#m)">
    <rect width="1200" height="360" fill="#140D22"/>
    <circle cx="905" cy="190" r="200" fill="#6B3FB8" opacity="0.30" filter="url(#b)"><animate attributeName="opacity" values=".30;.18;.30" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="20" r="150" fill="#F7A8D2" opacity="0.12" filter="url(#b)"/>
    <rect width="1200" height="360" fill="url(#p)"/>
  </g>
  <rect x="64" y="50" width="290" height="34" rx="17" fill="#1E1433" stroke="#3B2466"/>
  <circle cx="84" cy="67" r="5" fill="#F7A8D2"><animate attributeName="opacity" values="1;.3;1" dur="2s" repeatCount="indefinite"/></circle>
  <text x="100" y="73" style="font:600 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#E6DAF7">Robot de escritorio con IA</text>
  <text x="60" y="168" style="font:800 84px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#FFFFFF;letter-spacing:-2px">VINNA-01</text>
  <text x="64" y="208" style="font:400 21px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#A99BC4">Conversa, recuerda lo que le autorizas y te mira.</text>
  <text x="64" y="276" style="font:800 40px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#F7A8D2">3</text><text x="64" y="304" style="font:400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#A99BC4">modos de IA</text><text x="214.6" y="276" style="font:800 40px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#F7A8D2">6</text><text x="214.6" y="304" style="font:400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#A99BC4">expresiones</text><text x="365.2" y="276" style="font:800 40px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#F7A8D2">70</text><text x="365.2" y="304" style="font:400 16px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;fill:#A99BC4">pruebas automáticas</text>
  
  <g transform="translate(905 190)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g><animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="4s" repeatCount="indefinite"/>
      <!-- orejas -->
      <g><animateTransform attributeName="transform" type="rotate" values="0 -110 -40;0 -110 -40;-7 -110 -40;0 -110 -40;0 -110 -40" keyTimes="0;.62;.66;.7;1" dur="7s" repeatCount="indefinite"/>
        <path d="M-165 -30 L-140 -110 L-70 -70" stroke="#3B2466" stroke-width="30"/>
        <path d="M-150 -42 L-136 -92 L-92 -68 Z" fill="#F7A8D2" stroke="none"/>
        <path d="M-165 -30 L-140 -110 L-70 -70" stroke="#E6DAF7" stroke-width="16"/></g>
      <path d="M165 -30 L140 -110 L70 -70" stroke="#3B2466" stroke-width="30"/>
      <path d="M150 -42 L136 -92 L92 -68 Z" fill="#F7A8D2" stroke="none"/>
      <path d="M165 -30 L140 -110 L70 -70" stroke="#E6DAF7" stroke-width="16"/>
      <!-- ojos -->
      <g fill="#FFFFFF" stroke="#3B2466" stroke-width="8">
        <ellipse cx="-70" cy="20" rx="22" ry="27"><animate attributeName="ry" values="27;27;2;27;27;2;27;27" keyTimes="0;.4;.42;.44;.8;.815;.83;1" dur="6s" repeatCount="indefinite"/></ellipse>
        <ellipse cx="70" cy="20" rx="22" ry="27"><animate attributeName="ry" values="27;27;2;27;27;2;27;27" keyTimes="0;.4;.42;.44;.8;.815;.83;1" dur="6s" repeatCount="indefinite"/></ellipse>
      </g>
      <!-- chapitas -->
      <ellipse cx="-112" cy="58" rx="20" ry="9" fill="#B04A86" opacity=".85"/><ellipse cx="112" cy="58" rx="20" ry="9" fill="#B04A86" opacity=".85"/>
      <!-- nariz y boca -->
      <path d="M-8 40 L8 40 L0 50 Z" fill="#F7A8D2" stroke="#F7A8D2" stroke-width="4"/>
      <path d="M-34 56 Q-17 80 0 58 Q17 80 34 56" stroke="#3B2466" stroke-width="20"/>
      <path d="M-34 56 Q-17 80 0 58 Q17 80 34 56" stroke="#FFFFFF" stroke-width="9"/>
      <!-- bigotes -->
      <g stroke="#F7A8D2" stroke-width="7"><path d="M-210 36 L-150 44"/><path d="M-206 68 L-150 62"/><path d="M210 36 L150 44"/><path d="M206 68 L150 62"/></g>
    </g>
  </g>
</svg>
